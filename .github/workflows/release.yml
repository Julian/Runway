name: Release

# A version tag (v0.1.0) builds the signed release APK and attaches it to a GitHub release, which
# is what Obtainium watches. Signing needs two repository secrets: RUNWAY_RELEASE_KEY_B64 (the
# PKCS#12 key file, base64) and RUNWAY_RELEASE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions: {}

# One release build at a time per tag; a re-pushed tag cancels the stale run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release and upload the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version code is the commit count
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true # a release never reads a cache another run could have poisoned
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.RUNWAY_RELEASE_KEY_B64 }}
        run: printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build the signed release
        env:
          ORG_GRADLE_PROJECT_runwayStoreFile: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_runwayStorePassword: ${{ secrets.RUNWAY_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_runwayVersionName: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "runway-$TAG.apk"
          gh release create "$TAG" "runway-$TAG.apk" --title "Runway $TAG" --generate-notes
