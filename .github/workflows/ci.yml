name: CI

on:
  push:
    branches-ignore:
      - "wip*"
    tags:
      - "v*"
  pull_request:
  schedule:
    # Daily at 8:33
    - cron: "33 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref_name != 'main' }}
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Formatting, detekt, lint, unit tests, release build
        run: ./gradlew spotlessCheck detekt :app:lintDebug :app:testDebugUnitTest :app:assembleRelease

  instrumented:
    name: Instrumented tests (${{ matrix.device.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a hung emulator must not hold a runner for hours
    strategy:
      fail-fast: false # one device failing must not hide how the other did
      matrix:
        # One runner per device; the devices themselves are declared in app/build.gradle.kts.
        device:
          - name: Pixel 9, API 36
            task: pixel9Api36DebugAndroidTest
          - name: Pixel 10 Pro, API 37
            task: pixel10ProApi37DebugAndroidTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Gradle fetches the image, boots the emulator headless, runs the tests and discards it.
      # The same task runs on a laptop.
      - name: Run the instrumented tests on the managed device
        env:
          TASK: ${{ matrix.device.task }}
        run: ./gradlew ":app:$TASK" -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: instrumented-test-report-${{ matrix.device.task }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    name: Publish the release
    # A version tag (v0.1.0) publishes a signed APK as a GitHub release, which Obtainium watches,
    # once every check above has passed. Signing needs two repository secrets:
    # RUNWAY_RELEASE_KEY_B64 (the PKCS#12 key file, base64) and RUNWAY_RELEASE_KEY_PASSWORD.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [checks, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the GitHub release and upload the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version code is the commit count
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true # a release never reads a cache another run could have poisoned
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.RUNWAY_RELEASE_KEY_B64 }}
        run: printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      # -PrunwayProfile records the baseline profile on a managed AOSP emulator as part of the
      # build, so every release ships one recorded from its own code.
      - name: Build the signed release, with a fresh baseline profile
        env:
          ORG_GRADLE_PROJECT_runwayStoreFile: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_runwayStorePassword: ${{ secrets.RUNWAY_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_runwayVersionName: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease -PrunwayProfile -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "runway-$TAG.apk"
          gh release create "$TAG" "runway-$TAG.apk" --title "Runway $TAG" --generate-notes
