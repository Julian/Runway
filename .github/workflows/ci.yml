name: CI

on:
  push:
    branches-ignore:
      - "wip*"
    tags:
      - "v*"
  pull_request:
  schedule:
    # Daily at 8:33
    - cron: "33 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref_name != 'main' }}
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Formatting, detekt, lint, unit tests, release build
        run: ./gradlew spotlessCheck detekt :app:lintDebug :app:testDebugUnitTest :app:assembleRelease

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 36, not 37: the only API 37 x86 image this runner can name is the 16 KB
          # page-size one, whose system server dies during installs here. 36 is our minSdk.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8G # the default is too small; installs fail with ENOSPC
          ram-size: 4096M
          disable-animations: true
          script: |
            adb wait-for-device
            until adb shell cmd package list packages >/dev/null 2>&1; do sleep 2; done
            ./gradlew :app:connectedDebugAndroidTest || { adb logcat -d -t 400 '*:E'; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    name: Publish the release
    # A version tag (v0.1.0) publishes a signed APK as a GitHub release, which Obtainium watches,
    # once every check above has passed. Signing needs two repository secrets:
    # RUNWAY_RELEASE_KEY_B64 (the PKCS#12 key file, base64) and RUNWAY_RELEASE_KEY_PASSWORD.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [checks, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release and upload the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version code is the commit count
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true # a release never reads a cache another run could have poisoned
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.RUNWAY_RELEASE_KEY_B64 }}
        run: printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build the signed release
        env:
          ORG_GRADLE_PROJECT_runwayStoreFile: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_runwayStorePassword: ${{ secrets.RUNWAY_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_runwayVersionName: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "runway-$TAG.apk"
          gh release create "$TAG" "runway-$TAG.apk" --title "Runway $TAG" --generate-notes
