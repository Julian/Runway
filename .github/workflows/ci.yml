name: CI

on:
  push:
    branches-ignore:
      - "wip*"
    tags:
      - "v*"
  pull_request:
  schedule:
    # Daily at 8:33
    - cron: "33 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30 # about five minutes warm; a stuck daemon must not hold a runner for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref_name != 'main' }}
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      # The test APK is built here too: the instrumented shards read the Gradle cache this job
      # writes and never write it themselves, so the androidTest-only dependencies are fetched
      # here once rather than by every shard on every run. It also fails a test that does not
      # compile in minutes rather than after an emulator has booted.
      - name: Formatting, detekt, lint, unit tests, release and test builds
        run: ./gradlew spotlessCheck detekt :app:lintDebug :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest

  plan:
    name: Plan the shards
    # The one place the shard count is written. A matrix is evaluated before a job's env and
    # cannot read it, and expressions cannot count from a number, so the list the instrumented
    # jobs fan out over and the count they hand the test runner are both derived here instead of
    # being written twice and kept in step by hand. Nothing is checked out or built, so this
    # costs the shards a runner's startup rather than any work.
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.shards.outputs.indices }}
      count: ${{ steps.shards.outputs.count }}
    steps:
      - id: shards
        env:
          COUNT: 6 # why six: see the instrumented job below
        run: |
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "indices=$(jq -nc --argjson n "$COUNT" '[range($n)]')" >> "$GITHUB_OUTPUT"

  instrumented:
    name: Instrumented tests (${{ matrix.device.name }}, shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a hung emulator must not hold a runner for hours
    strategy:
      fail-fast: false # one device failing must not hide how the other did
      matrix:
        # A runner per device per shard; the devices themselves are declared in
        # app/build.gradle.kts. The suite is serial on one emulator and dwarfs everything else in
        # the run, so it is split: AndroidJUnitRunner hashes each test's name to a shard, and each
        # shard boots its own emulator and runs only its own slice. Every shard builds and boots
        # at the same time as the others rather than in turn, so a shard costs a runner, not wall
        # clock. Six is where it stops paying: a job has a floor near six and a half minutes, four
        # of build and boot and another two and three quarters the test harness takes to start on
        # a fresh emulator, so thinner slices past this buy seconds.
        device:
          - name: Pixel 9, API 36
            task: pixel9Api36DebugAndroidTest
          - name: Pixel 10 Pro, API 37
            task: pixel10ProApi37DebugAndroidTest
        shard: ${{ fromJSON(needs.plan.outputs.indices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Gradle fetches the image, boots the emulator headless, runs the tests and discards it.
      # The same task runs on a laptop.
      - name: Run this shard of the instrumented tests on the managed device
        env:
          TASK: ${{ matrix.device.task }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count }}
        run: >
          ./gradlew ":app:$TASK"
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          "-Pandroid.testInstrumentationRunnerArguments.numShards=$SHARDS"
          "-Pandroid.testInstrumentationRunnerArguments.shardIndex=$SHARD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A job that hits its timeout is cancelled, not failed, and those are the runs whose
        # report matters most.
        if: failure() || cancelled()
        with:
          name: instrumented-test-report-${{ matrix.device.task }}-shard${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  profile:
    name: Record the baseline profile
    # Recording walks a journey on a managed AOSP emulator (profile collection needs a rootable
    # image). It does not depend on a single test passing, so it runs beside the checks instead
    # of inside the release job, and finishes well inside the window they take. The release job
    # bakes in whatever this records, from the very same commit.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a hung emulator must not hold a runner for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # What a release ships must not come from a cache another run could have poisoned,
          # and this job feeds the release. Running cold costs it nothing it does not have:
          # it still lands inside the window the instrumented tests take.
          cache-disabled: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Without -PrunwayProfile the plugin writes what it records into src rather than baking it
      # straight into a build of its own, which is what lets the release job pick it up.
      - name: Record the profile on the managed AOSP emulator
        run: ./gradlew :app:generateReleaseBaselineProfile -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
          if-no-files-found: error # a release must never quietly ship without one

  signing:
    name: Check the signing secrets
    # An unset secret would otherwise decode to an empty key file, and the build would only
    # complain about it after the profile and the instrumented tests had spent their time.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          KEY_B64: ${{ secrets.RUNWAY_RELEASE_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.RUNWAY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" || { echo "::error::RUNWAY_RELEASE_KEY_B64 is not set"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::RUNWAY_RELEASE_KEY_PASSWORD is not set"; exit 1; }

  release:
    name: Publish the release
    # A version tag (v0.1.0) publishes a signed APK as a GitHub release, which Obtainium watches,
    # once every check above has passed. Signing needs two repository secrets:
    # RUNWAY_RELEASE_KEY_B64 (the PKCS#12 key file, base64) and RUNWAY_RELEASE_KEY_PASSWORD.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [signing, checks, instrumented, profile]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the GitHub release and upload the APK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version code is the commit count
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true # a release never reads a cache another run could have poisoned
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.RUNWAY_RELEASE_KEY_B64 }}
        run: printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Fetch the profile the profile job recorded
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
      # No -PrunwayProfile: the profile is already in src, so the build reads it there instead
      # of booting an emulator to record one. Every release still ships one from its own code.
      - name: Build the signed release, with the recorded baseline profile
        env:
          ORG_GRADLE_PROJECT_runwayStoreFile: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_runwayStorePassword: ${{ secrets.RUNWAY_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_runwayVersionName: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The mapping file goes up beside the APK: without it no stack trace from this build can
        # be read back, since the release is minified.
        run: |
          cp app/build/outputs/apk/release/app-release.apk "runway-$TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "runway-$TAG-mapping.txt"
          gh release create "$TAG" "runway-$TAG.apk" "runway-$TAG-mapping.txt" --title "Runway $TAG" --generate-notes
