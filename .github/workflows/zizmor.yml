name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # for uploading SARIF results
      contents: read # to read the workflows it audits
      actions: read # the SARIF upload reads the run it belongs to

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action uploads its findings to the Security tab, which is the point of running it
      # here at all when pre-commit already runs zizmor on every commit.
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
          version: 1.30.0 # the same zizmor pre-commit pins; move both together
