org.gradle.jvmargs=-Xmx4g
org.gradle.configuration-cache=true
org.gradle.caching=true

# Gradle-managed emulators draw with the host GPU here: the whole suite runs in under five minutes
# on both devices at once. CI has no GPU and passes the software renderer on its command line,
# which overrides this.
android.testoptions.manageddevices.emulator.gpu=host
