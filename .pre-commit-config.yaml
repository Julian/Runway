repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^app/schemas/ # generated by Room
      - id: mixed-line-ending
        args: [--fix, lf]
        exclude: ^gradlew\.bat$ # Gradle generates it with CRLF
      - id: trailing-whitespace
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        args: [--pedantic]
  - repo: local
    hooks:
      - id: ktfmt
        name: ktfmt (spotless)
        entry: ./gradlew -q spotlessApply
        language: system
        pass_filenames: false
        files: \.(kt|kts)$
      - id: detekt
        name: detekt
        entry: ./gradlew -q detekt
        language: system
        pass_filenames: false
        files: \.(kt|kts|yml)$
      - id: android-lint
        name: android lint
        entry: ./gradlew -q :app:lintDebug
        language: system
        pass_filenames: false
        files: ^app/
